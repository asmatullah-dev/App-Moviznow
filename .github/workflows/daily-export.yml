name: Daily Content Catalog Export

on:
  schedule:
    # Runs every day at 02:00 UTC (7:00 AM PKT / Pakistan Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  export-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Export Content Catalog from Firestore
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/exportContent.cjs

      - name: Commit and Push Updated Catalog Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add moviznow_catalog_export.json public/ src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily catalog export [skip ci]" && git push)
