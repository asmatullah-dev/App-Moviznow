name: Manual Content Catalog Export

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI or Admin Panel

jobs:
  export-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Bump Version (+0.0.01)
        run: node scripts/bumpVersion.cjs

      - name: Export Content Catalog from Firestore
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/exportContent.cjs

      - name: Commit and Push Updated Catalog, Reviews, and Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src/data/moviznow_catalog_export.json src/data/moviznow_reviews_export.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: bump version and update content catalog export [skip ci]" && git push)
