name: Deploy Firebase Functions

on:
  push:
    branches:
      - main

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (root)
        run: npm ci || npm install

      - name: Build Functions
        run: npm run build:functions

      - name: Install dependencies (functions)
        working-directory: ./functions
        run: npm ci || npm install

      - name: Create SA Key file
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: echo "$SA_KEY" > ${{ github.workspace }}/sa-key.json

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa-key.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only functions --project app-moviznow --non-interactive
