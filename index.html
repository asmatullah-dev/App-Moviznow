<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MovizNow - Your premium movie and series streaming platform" />
    
    <!-- Google AdSense Verification -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3128773545517669"
         crossorigin="anonymous"></script>
    
    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovizNow" />
    <meta property="og:url" content="https://moviznow.com/" />
    <meta property="og:title" content="Join MovizNow - Premium Movies & Series" />
    <meta property="og:description" content="Get 5 Days of premium membership for free on MovizNow! Watch and download your favorite movies and series." />
    <meta property="og:image" content="https://moviznow.com/moviznow_share_banner.jpg" />
    <meta property="og:image:secure_url" content="https://moviznow.com/moviznow_share_banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />
    <meta property="og:image:alt" content="MovizNow Share Banner" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://moviznow.com/" />
    <meta name="twitter:title" content="Join MovizNow - Premium Movies & Series" />
    <meta name="twitter:description" content="Get 5 Days of premium membership for free on MovizNow! Watch and download your favorite movies and series." />
    <meta name="twitter:image" content="https://moviznow.com/moviznow_share_banner.jpg" />

    <script>
      // Fallback: Dynamically adapt og:image and twitter:image if hosted on a different domain or preview URL
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.includes('moviznow.com')) {
            var ogImg = document.querySelector('meta[property="og:image"]');
            var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
            var twImg = document.querySelector('meta[name="twitter:image"]');
            var bannerPath = '/moviznow_share_banner.png';
            if (ogImg) ogImg.setAttribute('content', origin + bannerPath);
            if (ogSecImg) ogSecImg.setAttribute('content', origin + bannerPath);
            if (twImg) twImg.setAttribute('content', origin + bannerPath);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MovizNow</title>
    
    <script>
      // Apply theme on load
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Global variable to store the PWA install prompt
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
        // Dispatch a custom event to notify React
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: e }));
        console.log('PWA: beforeinstallprompt event captured globally');
      });
      window.addEventListener('appinstalled', (e) => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('PWA: appinstalled event captured globally');
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
