<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MovizNow - Your premium movie and series streaming platform" />
    
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="keywords" content="movies, web series, watch movies online, stream hd movies, popular tv shows, entertainment, moviznow" />
    
    <!-- Structured JSON-LD Schema for Google Search and AdSense Crawlers -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://moviznow.com/#website",
          "url": "https://moviznow.com/",
          "name": "MovizNow",
          "description": "Watch and stream high-quality movies and popular television series with ultra-fast playback and offline sync.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://moviznow.com/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://moviznow.com/#organization",
          "name": "MovizNow",
          "url": "https://moviznow.com/",
          "logo": "https://moviznow.com/logo.svg"
        }
      ]
    }
    </script>
    
    <!-- Google AdSense script is dynamically managed based on user membership and role -->
    
    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MovizNow" />
    <meta property="og:url" content="https://moviznow.com/" />
    <meta property="og:title" content="Join MovizNow - Premium Movies & Series" />
    <meta property="og:description" content="Get 10 Days of premium membership for free on MovizNow! Watch and download your favorite movies and series." />
    <meta property="og:image" content="https://moviznow.com/pwa-512x512.png" />
    <meta property="og:image:secure_url" content="https://moviznow.com/pwa-512x512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="MovizNow Share Banner" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://moviznow.com/" />
    <meta name="twitter:title" content="Join MovizNow - Premium Movies & Series" />
    <meta name="twitter:description" content="Get 10 Days of premium membership for free on MovizNow! Watch and download your favorite movies and series." />
    <meta name="twitter:image" content="https://moviznow.com/pwa-512x512.png" />

    <script>
      // Fallback: Dynamically adapt og:image and twitter:image if hosted on a different domain or preview URL
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.includes('moviznow.com')) {
            var ogImg = document.querySelector('meta[property="og:image"]');
            var ogSecImg = document.querySelector('meta[property="og:image:secure_url"]');
            var twImg = document.querySelector('meta[name="twitter:image"]');
            var bannerPath = '/moviznow_share_banner.png';
            if (ogImg) ogImg.setAttribute('content', origin + bannerPath);
            if (ogSecImg) ogSecImg.setAttribute('content', origin + bannerPath);
            if (twImg) twImg.setAttribute('content', origin + bannerPath);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MovizNow</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
      // Apply theme on load
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Global variable to store the PWA install prompt
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.deferredPrompt = e;
        // Dispatch a custom event to notify React
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: e }));
        console.log('PWA: beforeinstallprompt event captured globally');
      });
      window.addEventListener('appinstalled', (e) => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('PWA: appinstalled event captured globally');
      });
    </script>
  </head>
  <body class="bg-gray-950 text-white min-h-screen">
    <div id="root">
      <!-- Fast-rendering initial application splash loader while React JavaScript initializes -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #ffffff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <img src="/logo.svg" alt="MovizNow Logo" style="width: 64px; height: 64px; object-fit: contain; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;" />
          <div style="width: 32px; height: 32px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        </style>
      </div>
    </div>

    <!-- Semantic Crawler and Non-JS SEO Fallback: Crawlers without JS see full textual content and links -->
    <noscript>
      <div style="max-width: 900px; margin: 0 auto; padding: 24px; font-family: sans-serif; color: #e5e7eb; background: #0b0f19;">
        <header style="padding: 20px 0; text-align: center; border-bottom: 1px solid #1f2937;">
          <h1 style="margin: 0; font-size: 26px; color: #ffffff;">MovizNow - Premium Movie & Series Streaming Platform</h1>
          <p style="margin: 6px 0 0 0; color: #9ca3af;">Watch and stream high-quality cinema and episodic shows</p>
        </header>
        <main style="padding: 20px 0; line-height: 1.6;">
          <h2>Watch High-Quality Movies and Popular Television Series</h2>
          <p>MovizNow offers an extensive curated catalog of high-definition content spanning multiple genres, including Action, Comedy, Drama, Thriller, Sci-Fi, Romance, and Documentaries. Enjoy seamless streaming on any device with ultra-fast offline syncing and personalized recommendations.</p>
          
          <h3>Featured Entertainment Categories</h3>
          <ul>
            <li><strong>Latest Blockbusters:</strong> Explore recently released theatrical movies and award-winning international cinema.</li>
            <li><strong>Top-Rated Series:</strong> Binge-watch complete seasons of highly acclaimed television series and episodic shows.</li>
            <li><strong>Trending & Global Hits:</strong> Discover what is currently popular and trending globally among streaming enthusiasts.</li>
          </ul>

          <h3>Features and Services</h3>
          <ul>
            <li>Ultra HD & 4K streaming quality with adaptive bitrate playback.</li>
            <li>Smart offline catalog caching for fast on-the-go browsing.</li>
            <li>Personalized watchlists, continue watching progress, and language preferences.</li>
          </ul>
        </main>
        <footer style="padding: 16px 0; text-align: center; border-top: 1px solid #1f2937; color: #6b7280; font-size: 13px;">
          <p>&copy; 2026 MovizNow. All rights reserved.</p>
        </footer>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
